services:
  - type: web
    name: image-edit-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_PROVIDER
        value: fal-ai
      - key: MODEL_ID
        value: Qwen/Qwen-Image-Edit
